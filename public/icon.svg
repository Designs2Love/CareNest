<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Shield Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Subtle glowing circle -->
  <circle cx="256" cy="256" r="160" fill="url(#tealGrad)" opacity="0.15" />

  <!-- Shield Outline -->
  <path d="M256 96 C336 96 384 128 384 176 C384 288 296 368 256 400 C216 368 128 288 128 176 C128 128 176 96 256 96 Z" 
        fill="url(#tealGrad)" 
        filter="url(#shadow)" />
        
  <!-- Medical Cross / Pill Inside Shield -->
  <rect x="232" y="168" width="48" height="144" rx="24" fill="#ffffff" />
  <rect x="184" y="216" width="144" height="48" rx="24" fill="#ffffff" />
  
  <!-- Small Heart or Central Dot -->
  <circle cx="256" cy="240" r="14" fill="#0d9488" />
</svg>
